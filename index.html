<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rompecabeza de Sele 💕</title>
  <style>
    :root{--maxw:820px}
    html,body{height:100%}
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:0;min-height:100%;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px;background:linear-gradient(180deg,#fff 0%,#fffaf8 50%);color:#333}
    .card{width:100%;max-width:var(--maxw);display:flex;flex-direction:column;align-items:center;gap:12px}
    h1{margin:0;font-size:20px;color:#c85a9a}
    #preview{max-width:180px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
    #board-wrap{width:100%;display:flex;justify-content:center;position:relative}
    #board{width:100%;max-width:700px;aspect-ratio:1/1;border-radius:12px;background:linear-gradient(180deg, rgba(255,240,245,0.9), rgba(255,255,255,0.8));box-shadow:0 16px 40px rgba(0,0,0,0.06);position:relative;overflow:visible}
    .controls{display:flex;gap:10px;align-items:center}
    button{background:white;border:1px solid rgba(0,0,0,0.08);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .message{pointer-events:auto;transform:translateY(-20px);opacity:0;transition:all 420ms ease;border-radius:14px;padding:22px 28px;background:linear-gradient(180deg,rgba(255,255,255,0.98),rgba(255,245,250,0.95));box-shadow:0 12px 30px rgba(200,90,140,0.12);text-align:center}
    .message.show{transform:translateY(0);opacity:1}
    .message h2{margin:0 0 6px 0;color:#c8468f}
    .hearts{position:absolute;inset:0;pointer-events:none}
    .heart{position:absolute;width:28px;height:28px;background:radial-gradient(circle at 35% 30%,#fff 10%,transparent 11%),linear-gradient(180deg,#ff8fb9,#ff6fa4);transform:rotate(-45deg);left:50%;top:50%;opacity:0}
    .heart:before,.heart:after{content:'';position:absolute;width:28px;height:28px;background:linear-gradient(180deg,#ff8fb9,#ff6fa4);border-radius:50%}
    .heart:before{top:-14px;left:0}
    .heart:after{left:14px;top:0}
    footer{font-size:13px;color:#666;text-align:center}
    @media (max-width:420px){h1{font-size:18px}button{padding:8px 10px}.message{padding:16px}}
  </style>
</head>
<body>
  <div class="card">
    <h1>💖 Arma este rompecabezas</h1>
    <img id="preview" alt="Referencia" src="nosotras.jpeg"/>
    <div class="controls">
      <button id="resetBtn">Volver a armar</button>
      <div id="status" style="font-weight:600;color:#444">Piezas colocadas: 0 / 64</div>
    </div>
    <div id="board-wrap"><div id="board"></div></div>
    <footer>Arrastra las piezas para armar. Si una pieza queda cerca de su posición correcta, encajará automáticamente 💫</footer>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="hearts" id="hearts"></div>
    <div class="message" id="message">
      <h2>¡Lo lograste, hermosa! 💕</h2>
      <div style="margin-top:6px"><button id="closeMsg" style="padding:8px 12px;border-radius:8px">Cerrar</button></div>
    </div>
  </div>

  <script>
const IMG_NAME = 'nosotras.jpeg';
const ROWS = 8, COLS = 8;
const SNAP_THRESHOLD = 30;
const statusEl = document.getElementById('status');
const resetBtn = document.getElementById('resetBtn');
const overlay = document.getElementById('overlay');
const message = document.getElementById('message');
const heartsContainer = document.getElementById('hearts');

let pieces = [];
let placedCount = 0;

const img = new Image();
img.src = IMG_NAME;
img.onload = ()=>{ init(); }

function init(){
  pieces.forEach(p=>{ if(p.parentNode) p.parentNode.removeChild(p); });
  pieces=[]; placedCount=0; statusEl.textContent=`Piezas colocadas: 0 / ${ROWS*COLS}`;
  const cellW = 700 / COLS;
  const cellH = 700 / ROWS;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const piece = document.createElement('div');
      piece.className='piece';
      piece.style.width = cellW+'px';
      piece.style.height = cellH+'px';
      piece.style.position = 'absolute';
      piece.style.backgroundImage=`url(${IMG_NAME})`;
      piece.style.backgroundSize = `700px 700px`;
      piece.style.backgroundPosition = `-${c*cellW}px -${r*cellH}px`;
      piece.dataset.tx = c*cellW;
      piece.dataset.ty = r*cellH;
      piece.style.left = (Math.random()*(window.innerWidth - cellW))+'px';
      piece.style.top = (Math.random()*(window.innerHeight - cellH))+'px';
      piece.style.cursor = 'grab';
      piece.addEventListener('pointerdown', startDrag);
      document.body.appendChild(piece);
      pieces.push(piece);
    }
  }
}

let active=null, startX=0, startY=0, initLeft=0, initTop=0;
function startDrag(e){
  active = e.currentTarget;
  active.setPointerCapture(e.pointerId);
  active.style.zIndex=1000;
  startX = e.clientX; startY = e.clientY;
  initLeft = parseFloat(active.style.left); initTop = parseFloat(active.style.top);
  active.addEventListener('pointermove', onDrag);
  active.addEventListener('pointerup', endDrag);
}
function onDrag(e){
  if(!active) return;
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;
  active.style.left = initLeft + dx + 'px';
  active.style.top = initTop + dy + 'px';
}
function endDrag(e){
  if(!active) return;
  active.removeEventListener('pointermove', onDrag);
  active.removeEventListener('pointerup', endDrag);
  const tx = parseFloat(active.dataset.tx), ty = parseFloat(active.dataset.ty);
  const cx = parseFloat(active.style.left), cy = parseFloat(active.style.top);
  const dist = Math.hypot(cx-tx, cy-ty);
  if(dist <= SNAP_THRESHOLD){
    active.style.left = tx+'px';
    active.style.top = ty+'px';
    active.style.pointerEvents='none';
    placedCount++;
    statusEl.textContent=`Piezas colocadas: ${placedCount} / ${ROWS*COLS}`;
    if(placedCount===ROWS*COLS){ showSuccess(); }
  }
  active.style.zIndex='';
  active=null;
}

function showSuccess(){
  overlay.style.pointerEvents='auto';
  message.classList.add('show');
}

resetBtn.addEventListener('click', ()=>{ init(); overlay.style.pointerEvents='none'; message.classList.remove('show'); heartsContainer.innerHTML=''; });
document.getElementById('closeMsg').addEventListener('click', ()=>{ overlay.style.pointerEvents='none'; message.classList.remove('show'); heartsContainer.innerHTML=''; });

</script>
</body>
</html>
